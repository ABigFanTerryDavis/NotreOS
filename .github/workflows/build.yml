name: Build NotreOS Ancient

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '.github/workflows/build.yml'
      - '.github/workflows/boot-test-artifact.yml'
      - 'tests/qemu-smoke.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential cpio dosfstools file flex gawk git \
            libelf-dev libncurses-dev libssl-dev mtools perl python3 \
            qemu-system-x86 rsync unzip wget xorriso xz-utils ovmf

      - name: Run host smoke tests
        run: ./tests/unit-smoke.sh

      - name: Build NotreOS from source
        run: ./scripts/build.sh

      - name: Boot the NotreBoot ISO under OVMF and test NotreShell
        run: |
          firmware_code="$(find /usr/share \( -type f -o -type l \) \
            \( -name 'OVMF_CODE.fd' -o -name 'OVMF_CODE_4M.fd' \) \
            -print -quit)"
          if [ -z "$firmware_code" ]; then
            echo "No non-secure OVMF_CODE firmware found; available OVMF files:" >&2
            find /usr/share \( -type f -o -type l \) -iname '*OVMF*.fd' -print >&2
            exit 1
          fi
          case "$firmware_code" in
            *OVMF_CODE_4M.fd) firmware_vars="${firmware_code%OVMF_CODE_4M.fd}OVMF_VARS_4M.fd" ;;
            *OVMF_CODE.fd) firmware_vars="${firmware_code%OVMF_CODE.fd}OVMF_VARS.fd" ;;
          esac
          if [ ! -f "$firmware_vars" ]; then
            echo "Matching OVMF variables template not found: $firmware_vars" >&2
            find /usr/share \( -type f -o -type l \) -iname '*OVMF*.fd' -print >&2
            exit 1
          fi
          firmware_vars_copy="$RUNNER_TEMP/notreos-ovmf-vars.fd"
          cp "$firmware_vars" "$firmware_vars_copy"
          echo "Using OVMF code: $firmware_code"
          echo "Using writable OVMF variables: $firmware_vars_copy"
          python3 tests/qemu-smoke.py \
            output/images/notreos-ancient-0.0.1-x86_64-uefi.iso \
            "$firmware_code" "$firmware_vars_copy"

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotreOS-Ancient-0.0.1-x86_64
          if-no-files-found: error
          path: |
            output/images/notreos-ancient-0.0.1-x86_64-uefi.iso
            output/images/rootfs.ext4
            output/images/bzImage
            output/images/NotreBootX64.efi
            output/images/notreos-ancient-0.0.1-manifest.txt
